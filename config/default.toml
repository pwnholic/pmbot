[general]
mode = "live"                          # "paper" | "live"
log_level = "info"
strategies = ["lead_lag", "fair_value"]

[wallet]
encrypted_key_path = ""
signature_type = "gnosis_safe"

[clob]
host = "https://clob.polymarket.com"
ws_host = "wss://ws-subscriptions-clob.polymarket.com"
chain_id = 137

[builder]
api_key = ""
api_secret = ""
api_passphrase = ""

[market]
discovery_interval_secs = 60
min_liquidity = 5000
min_volume = 10000
tags = ["crypto"]
market_type = "15min"
no_trade_zone_secs = 60
rotation_lookahead_secs = 30

[risk]
bankroll = 1000.0
kelly_fraction = 0.15
max_position_pct = 0.05
max_positions = 5
daily_loss_limit_pct = 0.05
stop_loss_pct = 0.30
take_profit_multiplier = 2.0
min_edge = 0.08
kill_switch_path = "/tmp/pmbot-kill"

[feed.binance]
enabled = true
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
vol_window_secs = 900
vol_method = "ewma"

[strategy.lead_lag]
enabled = true
lag_threshold = 0.02
entry_delay_ms = 500
exit_convergence_pct = 0.005

[strategy.fair_value]
enabled = true
min_time_to_expiry_secs = 120
vol_multiplier = 1.0

[strategy.flash_crash]
enabled = false
drop_threshold = 0.15
lookback_secs = 30
reversion_target = 0.5

[strategy.book_imbalance]
enabled = false
imbalance_threshold = 0.6
levels = 5

[strategy.negrisk_arb]
enabled = false
sum_deviation_threshold = 0.02

[strategy.convergence]
enabled = false
min_probability = 0.90
max_time_to_expiry_secs = 300

[strategy.market_maker]
enabled = false
spread_bps = 200
max_inventory = 100
quote_size = 10
refresh_interval_ms = 1000

[tui]
enabled = true
refresh_rate_ms = 100
log_buffer_size = 500

[backtest]
data_dir = "data/"
output_dir = "reports/"
slippage_bps = 5

[general]
mode = "paper"                          # "paper" | "live"
log_level = "info"
strategies = ["lead_lag", "fair_value"]

[wallet]
signature_type = "gnosis_safe"

[clob]
host = "https://clob.polymarket.com"

[market]
discovery_interval_secs = 60
min_liquidity = 1000
min_volume = 0
tags = ["crypto"]
market_type = "5min"
keyword = "BTC"
no_trade_zone_secs = 30
rotation_lookahead_secs = 15

[risk]
bankroll = 1000.0
kelly_fraction = 0.15
max_position_pct = 0.05
max_positions = 5
daily_loss_limit_pct = 0.05
stop_loss_pct = 0.30
take_profit_multiplier = 2.0
min_edge = 0.08
no_trade_zone_secs = 60
kill_switch_path = "/tmp/pmbot-kill"

[feed.binance]
symbols = ["BTCUSDT"]
vol_window_secs = 900
vol_method = "ewma"

[strategy.lead_lag]
lag_threshold = 0.02
entry_delay_ms = 500
exit_convergence_pct = 0.005

[strategy.fair_value]
min_time_to_expiry_secs = 120
vol_multiplier = 1.0

[strategy.flash_crash]
drop_threshold = 0.15
lookback_secs = 30
reversion_target = 0.5

[strategy.book_imbalance]
imbalance_threshold = 0.6
levels = 5

[strategy.negrisk_arb]
sum_deviation_threshold = 0.02

[strategy.convergence]
min_probability = 0.90
max_time_to_expiry_secs = 300

[strategy.market_maker]
spread_bps = 200
max_inventory = 100
quote_size = 10
refresh_interval_ms = 1000

[tui]
refresh_rate_ms = 100
log_buffer_size = 500
